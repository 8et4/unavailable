<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Service Unavailable | Almix Cloud</title>
  <link rel="icon" href="logo.png">
  <style>
    :root {
      --text: #f2f2f2;
      --muted: #a8aaaa;
      --line: rgba(255, 255, 255, 0.12);
      --panel: rgba(20, 21, 21, 0.72);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: #1b1c1c url("bg.png") center / cover no-repeat fixed;
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: grid;
      place-items: center;
      padding: 16px;
    }
    main {
      width: 100%;
      max-width: 460px;
      text-align: center;
      padding: 48px 32px 40px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }
    .logo { width: 120px; height: 120px; display: block; margin: 0 auto 24px; }
    .brand {
      font-size: 13px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 28px;
    }
    .code {
      font-size: 64px;
      font-weight: 700;
      line-height: 1;
      margin: 0 0 8px;
      letter-spacing: -0.02em;
    }
    h1 { font-size: 22px; font-weight: 600; margin: 0 0 14px; }
    p.msg { color: var(--muted); line-height: 1.6; margin: 0 0 28px; font-size: 15px; }
    button {
      font: inherit;
      font-size: 14px;
      color: var(--text);
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 999px;
      padding: 10px 26px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    button:hover { background: rgba(255, 255, 255, 0.08); border-color: rgba(255, 255, 255, 0.6); }
    button:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
    footer { margin-top: 28px; font-size: 12px; color: var(--muted); }
    @media (max-width: 420px) {
      main { padding: 36px 20px 32px; }
      .code { font-size: 52px; }
    }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="logo.png" alt="Almix Cloud logo">
    <p class="brand">Almix Cloud</p>
    <p class="code" aria-hidden="true">503</p>
    <h1>Service Unavailable</h1>
    <p class="msg">This instance is temporarily offline, either for maintenance or because it's being brought up. Please check back shortly.</p>
    <button type="button" onclick="location.reload()">Try again</button>
    <footer>&copy; <span id="y">2026</span> Almix Cloud</footer>
  </main>
  <script>document.getElementById("y").textContent = new Date().getFullYear();</script>
</body>
</html>
